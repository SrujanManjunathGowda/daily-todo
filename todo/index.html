```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Daily Todo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="greeting">GOOD MORNING 👋</p>
                <h1>My Daily Todo</h1>
                <p id="date"></p>
            </div>

            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>


        <!-- Progress Card -->
        <section class="progress-card">

            <div class="progress-top">
                <div>
                    <p>Today's Progress</p>
                    <h2 id="progressText">0%</h2>
                </div>

                <div class="progress-circle">
                    <span id="progressCount">0/0</span>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <p id="motivation">Let's make today productive! 💪</p>

        </section>


        <!-- Add Task -->
        <section class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you want to accomplish?"
            >

            <button id="addBtn">+ Add Task</button>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <div class="section-title">
                <h2>Today's Tasks</h2>
                <span id="taskCount">0 tasks</span>
            </div>

            <div id="taskList" class="task-list"></div>

            <div id="emptyState" class="empty-state">
                <div>📝</div>
                <h3>No tasks yet</h3>
                <p>Add your first task and start your day.</p>
            </div>

        </section>


        <!-- Streak -->
        <section class="streak-card">

            <div class="streak-icon">🔥</div>

            <div>
                <p>Current Streak</p>
                <h2><span id="streak">0</span> Days</h2>
            </div>

        </section>


        <footer>
            <p>Small progress every day. 🚀</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
